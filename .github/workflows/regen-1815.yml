name: regen-1815

# One-off. Merges google/osv-scalibr main into paypal-secret-detector, resolves
# the SecretData.secret field-number collision (http_cookie keeps 92,
# paypal_credentials moves to 93), regenerates scan_result.pb.go with the same
# protoc / protoc-gen-go the upstream CI uses, builds, runs the affected tests,
# and pushes the merge commit to paypal-secret-detector as you. Fails loudly
# and pushes nothing if anything is not exactly as expected.
#
# Runs automatically when this file is pushed on branch ci/regen-1815.

on:
  push:
    branches: [ "ci/regen-1815" ]

permissions:
  contents: write

jobs:
  merge-and-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paypal-secret-detector
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go

      - name: Merge upstream main (expect exactly the two known conflicts)
        run: |
          set -euxo pipefail
          git config user.name "Layau Eulizier Jr"
          git config user.email "130326664+cybrdude@users.noreply.github.com"
          git remote add upstream https://github.com/google/osv-scalibr.git
          git fetch upstream main
          set +e
          git merge --no-ff --no-commit upstream/main
          set -e
          n=$(git diff --name-only --diff-filter=U | wc -l)
          git diff --name-only --diff-filter=U
          git diff --name-only --diff-filter=U | grep -qx binary/proto/scan_result.proto
          git diff --name-only --diff-filter=U | grep -qx binary/proto/scan_result_go_proto/scan_result.pb.go
          test "$n" -eq 2

      - name: Resolve the proto conflict (paypal_credentials moves to 93)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          p = 'binary/proto/scan_result.proto'
          lines = open(p).read().split(chr(10))
          starts = [i for i, l in enumerate(lines) if l.startswith('<<<<<<< ')]
          assert len(starts) == 1, starts
          i = starts[0]
          mid = lines.index('=======', i)
          end = next(j for j in range(mid, len(lines)) if lines[j].startswith('>>>>>>> '))
          ours = lines[i + 1:mid]
          theirs = lines[mid + 1:end]
          assert [l.strip() for l in ours] == ['PayPalCredentials paypal_credentials = 92;'], ours
          assert [l.strip() for l in theirs] == ['HTTPCookie http_cookie = 92;'], theirs
          new = lines[:i] + theirs + [ours[0].replace('= 92;', '= 93;')] + lines[end + 1:]
          s = chr(10).join(new)
          assert 'paypal_credentials = 93;' in s and 'http_cookie = 92;' in s
          assert '<<<<<<<' not in s and '>>>>>>>' not in s
          open(p, 'w').write(s)
          print('proto resolved')
          EOF
          git checkout --theirs binary/proto/scan_result_go_proto/scan_result.pb.go
          git add binary/proto/scan_result.proto binary/proto/scan_result_go_proto/scan_result.pb.go

      - name: Regenerate scan_result.pb.go from the merged proto
        run: |
          set -euxo pipefail
          touch binary/proto/scan_result.proto
          ./build_protos.sh
          grep -q 'PaypalCredentials' binary/proto/scan_result_go_proto/scan_result.pb.go
          grep -q 'HttpCookie' binary/proto/scan_result_go_proto/scan_result.pb.go
          git status --short

      - name: Build and test
        run: |
          set -euxo pipefail
          CGO_ENABLED=1 go build ./...
          CGO_ENABLED=1 go test ./binary/proto/... ./veles/secrets/paypal/... ./extractor/filesystem/list/... ./enricher/enricherlist/...

      - name: Commit the merge and push to paypal-secret-detector
        run: |
          set -euxo pipefail
          git add -A
          git commit -m "Merge branch 'main' into paypal-secret-detector" -m "Resolves the SecretData.secret field-number collision: main added HTTPCookie http_cookie = 92, so paypal_credentials moves to 93. scan_result.pb.go regenerated with protoc from the merged proto."
          git log --oneline -3
          git push origin HEAD:paypal-secret-detector
